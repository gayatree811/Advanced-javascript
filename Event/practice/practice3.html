<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Form Card</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5c9;
    }

    #main {
      display: flex;
      gap: 40px;
      padding: 20px;
    }

    form {
      width: 200px;
    }

    input {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 5px;
    }

    .card {
      width: 250px;
      padding: 15px;
      border: 1px solid red;
      border-radius: 10px;
      background: #fffbe6;
    }

    .profile {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <div id="main">
    <form id="myForm">
      <input id="name" type="text" placeholder="Name" required>
      <input id="age" type="text" placeholder="Age" required>
      <input id="email" type="text" placeholder="Email" required>
      <input id="img" type="url" placeholder="Image URL" required>
      <input type="submit" value="Submit">
    </form>
  </div>

  <script src="practice3.js"></script>
</body>
</html>
